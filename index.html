<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resturant--menu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="head">Welcome To Your Restaurant</header>
    <div class="page">
      <div class="container" id="dishes">
        <header class="title">Main Dishes</header>
        <div class="img-container" id="pack1">
          <img src="images/main.jpg" />
          <img src="images/main2.jpg" />
          <img src="images/main3.jpg" />
          <img src="images/main4.jpg" />
          <img src="images/main5.jpg" />
        </div>
      </div>
      <div class="container" id="juices">
        <header class="title">Juice</header>
        <div class="img-container" id="pack2">
          <img src="images/jui1.jpg" alt="" />
          <img src="images/jui2.jpg" alt="" />
        </div>
      </div>
      <div class="container" id="appe">
        <header class="title">Appetizers</header>
        <div class="img-container" id="pack3">
          <img src="images/appe1.jpg" alt="" />
          <img src="images/app2.jpg" alt="" />
          <img src="images/appe3.jpg" alt="" />
        </div>
      </div>
      <div class="container" id="dessert">
        <header class="title">Dessert</header>
        <div class="img-container" id="pack4">
          <img src="images/dess1.jpg" alt="" />
          <img src="images/dess2.jpg" alt="" />
          <img src="images/dess3.jpg" alt="" />
          <img src="images/dess4.jpg" alt="" />
        </div>
      </div>
      <div class="container" id="order-made">
        <header class="title"> Desire</header>
        <div class="img-container" id="pack5">
          <img src="images/order2.webp"  />
        </div>
      </div>
      <div class="container" id="specials">
        <header class="title">Friday Specials</header>
        <div class="img-container" id="pack6">
          <img src="images/spec1.jpg" alt="" />
          <img src="images/spec2.jpg" alt="" />
          <img src="images/spec3.jpg" alt="" />
          <img src="images/spec4.jpg" alt="" />
          <img src="images/spec5.jpg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
